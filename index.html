<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@1,500&family=Jost:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="hero">
    <video id="heroVideo" autoplay muted loop playsinline preload="auto"></video>
    <div class="vidrio" aria-hidden="true"></div>
    <div class="borde" aria-hidden="true"></div>

    <div class="aviso">Envío gratis en pedidos de 2 o más productos</div>

    <header class="cabecera">
      <div class="grupo">
        <button class="icono" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <button class="icono" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></button>
      </div>
      <a class="logo" href="#">MI TIENDA</a>
      <div class="grupo">
        <button class="icono" aria-label="Mi cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c.8-4.5 4.3-6.5 8.5-6.5s7.7 2 8.5 6.5z"/></svg></button>
        <button class="icono" aria-label="Carrito"><svg viewBox="0 0 24 24"><path d="M5 8h14l1 13H4z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg></button>
      </div>
    </header>

    <div class="hero-texto">
      <h1>Bienvenidos a MI TIENDA</h1>
      <p>El guardarropa perfecto para ti</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
